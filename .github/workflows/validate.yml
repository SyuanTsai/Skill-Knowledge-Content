name: validate

on:
  push:
  pull_request:

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository
        shell: pwsh
        run: ./scripts/validate.ps1
      - name: Run tests
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser
          Invoke-Pester ./tests -CI
